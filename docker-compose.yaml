services:
  artemis:
    image: apache/activemq-artemis:latest-alpine
    environment:
      ANONYMOUS_LOGIN: "true"
    volumes:
      - ./docker/configure-artemis-unsuback-tests.sh:/configure-artemis-unsuback-tests.sh:ro
    post_start:
      - command: /bin/sh /configure-artemis-unsuback-tests.sh
        user: root
    ports:
      - "1883:1883"
    security_opt:
      - no-new-privileges:true

  mosquitto:
    image: eclipse-mosquitto:2
    command: /bin/sh /mosquitto/config/start-mosquitto-dynsec.sh
    volumes:
      - ./docker/mosquitto-dynsec.conf:/mosquitto/config/mosquitto-dynsec.conf:ro
      - ./docker/start-mosquitto-dynsec.sh:/mosquitto/config/start-mosquitto-dynsec.sh:ro
    tmpfs:
      - /mosquitto/data
    ports:
      - "1884:1883"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_ctrl -h 127.0.0.1 -p 1883 -u admin -P admin dynsec getClient zmqtt-mosquitto >/dev/null 2>&1",
        ]
      interval: 1s
      timeout: 2s
      retries: 30
    security_opt:
      - no-new-privileges:true

  hivemq:
    image: hivemq/hivemq-ce:latest
    ports:
      - "1886:1883"
    security_opt:
      - no-new-privileges:true

  nanomq:
    image: emqx/nanomq:latest
    ports:
      - "1887:1883"
    security_opt:
      - no-new-privileges:true

  emqx:
    image: emqx/emqx@sha256:0ba29902a8e552f7152754860b4b61b49a7e16fa376035bcf10021e944b2c0a0 # 6.2.2
    ports:
      - 1888:1883
    security_opt:
      - no-new-privileges:true
