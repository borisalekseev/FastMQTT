name: Docs

on:
  pull_request:
  merge_group:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the selected revision to GitHub Pages
        required: true
        default: false
        type: boolean

concurrency:
  group: docs-${{ github.event.release.tag_name || github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.10"
          enable-cache: false
      - name: Install documentation dependencies
        run: uv sync --locked --group docs
      - name: Verify changelog mirror
        run: cmp CHANGELOG.md docs/changelog.md
      - name: Build documentation
        run: uv run mkdocs build --strict
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'release' || inputs.deploy
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    name: Docs deploy
    if: github.event_name == 'release' || inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
