name: Event Notifier

on:
  issues:
    types: [opened, labeled, reopened]
  pull_request_target:
    types: [opened, reopened] # zizmor: ignore[dangerous-triggers]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  issues: read
  pull-requests: read

jobs:
  notify:
    name: "Telegram notification"
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification for new issue or pull request
        uses: reagento/relator@879d895c8d7f44cfe7471bda4f5449c233e6f986 # v1.7.1
        with:
          tg-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          tg-chat-id: ${{ vars.TELEGRAM_CHAT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
  notify-oss-board:
    name: "Send Telegram notification to OSS board"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'issues' &&
      (contains(github.event.issue.labels.*.name, 'good first issue') ||
      github.event.label.name == 'help wanted')
    steps:
      - name: Send Telegram notification to OSS board
        uses: reagento/relator@879d895c8d7f44cfe7471bda4f5449c233e6f986 # v1.7.1
        with:
          tg-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          tg-chat-id: ${{ vars.GFI_CHAT }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          join-input-with-list: "1"
          custom-labels: "faststream,zmqtt"
